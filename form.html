<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<title>Formulário</title>
</head>
<body>

<header>
    <img src="img/logo.png" alt="logo" style="height:40px; vertical-align:middle;">
    <nav style="display:inline;">
        <a href="index.html">Home</a>
        <a href="form.html">Formulário</a>
        <a href="about.html">Sobre</a>
    </nav>
</header>

<div class="container">
<h2>Formulário de Contato</h2>
<form action="formAction.html" method="GET" onsubmit="return validateForm()">
<label>Nome:</label><br>
<input type="text" id="name" name="name">
<div id="errName" class="error"></div>

<label>Email:</label><br>
<input type="text" id="email" name="email">
<div id="errEmail" class="error"></div>

<label>Mensagem:</label><br>
<textarea id="msg" name="msg"></textarea>
<div id="errMsg" class="error"></div>

<button type="submit">Enviar</button>
</form>
</div>
<script src="js/script.js"></script>
</body>
</html>
